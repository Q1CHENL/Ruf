name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check shell and whitespace
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          bash -n script/build_and_run.sh
          case "$EVENT_NAME" in
            pull_request)
              diff_base="$PR_BASE_SHA"
              ;;
            push)
              if [[ "$PUSH_BASE_SHA" =~ ^0+$ ]]; then
                diff_base="$(git merge-base HEAD "origin/$DEFAULT_BRANCH")"
              else
                diff_base="$PUSH_BASE_SHA"
              fi
              ;;
            workflow_dispatch)
              diff_base="HEAD^"
              ;;
          esac
          git diff --check "$diff_base" HEAD

      - name: Build with strict warnings
        run: swift build -Xswiftc -warnings-as-errors

      - name: Run tests with strict warnings
        run: swift test -Xswiftc -warnings-as-errors

      - name: Build local distribution-shaped artifacts
        env:
          RUF_STRICT_WARNINGS: "1"
        run: ./script/build_and_run.sh --package

      - name: Validate app and disk image
        run: |
          codesign --verify --deep --strict --verbose=2 dist/Ruf.app
          hdiutil verify dist/Ruf.dmg
          architectures="$(lipo -archs dist/Ruf.app/Contents/MacOS/Ruf)"
          [[ "$architectures" == *arm64* ]]
          [[ "$architectures" == *x86_64* ]]
          if ./script/build_and_run.sh --appcast; then
            echo "Ad-hoc artifacts must not be accepted for an appcast" >&2
            exit 1
          fi
