name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check shell and whitespace
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          bash -n script/build_and_run.sh
          case "$EVENT_NAME" in
            pull_request)
              diff_base="$PR_BASE_SHA"
              ;;
            push)
              if [[ ! "$PUSH_BASE_SHA" =~ ^0+$ ]] \
                && git cat-file -e "$PUSH_BASE_SHA^{commit}" 2>/dev/null; then
                diff_base="$PUSH_BASE_SHA"
              else
                # A new branch has no previous head, and a force-push's
                # previous head is no longer fetched. Check what the push adds
                # to the default branch, or its last commit when it is the
                # default branch.
                diff_base="$(git merge-base HEAD "origin/$DEFAULT_BRANCH")"
                if [[ "$diff_base" == "$(git rev-parse HEAD)" ]]; then
                  diff_base="HEAD^"
                fi
              fi
              ;;
            workflow_dispatch)
              diff_base="HEAD^"
              ;;
          esac
          git diff --check "$diff_base" HEAD

      - name: Build with strict warnings
        run: swift build --only-use-versions-from-resolved-file -Xswiftc -warnings-as-errors

      - name: Run tests with strict warnings
        run: swift test --only-use-versions-from-resolved-file -Xswiftc -warnings-as-errors

      - name: Build local distribution-shaped artifacts
        env:
          RUF_STRICT_WARNINGS: "1"
        run: ./script/build_and_run.sh --package

      - name: Validate app and disk image
        run: |
          codesign --verify --deep --strict --verbose=2 dist/Ruf.app
          hdiutil verify dist/Ruf.dmg
          ./script/build_and_run.sh --validate-package
          architectures="$(lipo -archs dist/Ruf.app/Contents/MacOS/Ruf)"
          [[ "$architectures" == *arm64* ]]
          [[ "$architectures" == *x86_64* ]]
          if ./script/build_and_run.sh --appcast; then
            echo "Ad-hoc artifacts must not be accepted for an appcast" >&2
            exit 1
          fi
